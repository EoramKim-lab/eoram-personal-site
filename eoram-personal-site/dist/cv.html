<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curriculum Vitae</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#182538;font:14px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.toolbar{max-width:850px;margin:25px auto;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:0 20px;font-size:13px}.toolbar a{color:#374151;text-decoration:none}.toolbar button{background:#374151;color:white;padding:10px 17px;border:0;border-radius:3px;cursor:pointer;font:inherit}.sheet{background:white;max-width:850px;margin:0 auto 30px;padding:48px 58px;box-shadow:none}h1{font-size:37px;letter-spacing:-1.7px;margin:0;line-height:1.2}h1 span{color:#374151}h2{font-size:14px;color:#374151;border-bottom:1px solid #dce2e9;padding-bottom:8px;letter-spacing:.02em;margin:27px 0 12px}h3{font-size:13px;margin:10px 0 3px}p{margin:3px 0;font-size:12px;color:#586477}ul{margin:5px 0;padding-left:18px;color:#586477;font-size:12px}.intro{margin-top:12px;font-size:13px}.qualifications{display:grid;grid-template-columns:1fr 1fr;gap:18px}.skills{display:grid;grid-template-columns:95px 1fr;gap:8px 20px;font-size:12px;color:#586477}.skills strong{font-size:11px;color:#182538}section{break-inside:avoid}.draft{border-top:1px solid #dce2e9;margin-top:25px;padding-top:12px;font-size:10px;color:#8390a1}.toolbar a:focus-visible,.toolbar button:focus-visible{outline:3px solid #374151;outline-offset:4px}[hidden]{display:none!important}@media(max-width:600px){.sheet{margin:0;padding:30px 24px}.toolbar{font-size:12px}.qualifications{grid-template-columns:1fr}}@page{size:A4;margin:16mm}@media print{body{background:white}.toolbar{display:none}.sheet{box-shadow:none;max-width:none;margin:0;padding:0}h1{font-size:31px}h2{margin-top:20px}.draft{display:none}a{color:inherit;text-decoration:none}}
</style></head><body><div class="toolbar"><a href="./index.html#cv">← 사이트로 돌아가기</a><button id="print" type="button">인쇄 / PDF로 저장</button></div>
<main class="sheet"><h1 id="cv-name">&nbsp;</h1><p id="cv-intro" class="intro">&nbsp;</p><p id="contact" hidden></p>
<section><h2>EDUCATION</h2><h3>&nbsp;</h3><p>&nbsp;</p></section>
<section><h2>RESEARCH EXPERIENCE</h2><h3>&nbsp;</h3><ul><li>&nbsp;</li><li>&nbsp;</li><li>&nbsp;</li></ul></section>
<section><h2>SELECTED PROJECTS</h2><h3>&nbsp;</h3><p>&nbsp;</p><h3>&nbsp;</h3><p>&nbsp;</p><h3>&nbsp;</h3><p>&nbsp;</p></section>
<section><h2>TECHNICAL SKILLS</h2><div class="skills"><strong>Programming</strong><span>&nbsp;</span><strong>Control</strong><span>&nbsp;</span><strong>Robotics</strong><span>&nbsp;</span><strong>ML & Data</strong><span>&nbsp;</span></div></section>
<section><h2>QUALIFICATIONS & ACTIVITIES</h2><div class="qualifications"><div><h3>&nbsp;</h3><p>&nbsp;</p></div><div><h3>&nbsp;</h3><p>&nbsp;</p></div></div><h3>&nbsp;</h3><p>&nbsp;</p></section><p class="draft">&nbsp;</p></main><script src="./assets/content.js"></script><script>document.getElementById('print').addEventListener('click',()=>window.print());const p=window.PORTFOLIO.profile;document.getElementById('cv-name').textContent=p.name||'\u00a0';document.getElementById('cv-intro').textContent=p.subtitle||'\u00a0';const values=[];if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))values.push(p.email);try{const u=new URL(p.github);if(u.protocol==='https:')values.push(u.href);}catch{}if(values.length){const c=document.getElementById('contact');c.hidden=false;c.textContent=values.join(' · ');}</script></body></html>
